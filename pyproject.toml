[project]
name = "hawkgram"
dynamic = ["version"]
description = "Elegant, modern and asynchronous Telegram MTProto API framework in Python for users and bots"
authors = [{ name = "Lone Hawk" }]
# cryptography provides AES when TgCrypto isn't installed and python-socks connects through proxies.
# pymediainfo-pyrofork is a fork maintained by a single third party: it's capped at the latest reviewed release,
# so a new release is only installed after it has been reviewed and the bound raised
dependencies = [
    "cryptography>=42.0.0",
    "python-socks[asyncio]>=3.0.0,<4.0.0",
    "pymediainfo-pyrofork>=6.0.1,<=6.0.2",
]
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = "~=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["telegram chat messenger mtproto api client library python"]

[tool.hatch.version]
path = "pyrogram/__init__.py"

# Used to call hatch_build.py
[tool.hatch.build.hooks.custom]

[project.urls]
Homepage = "https://github.com/Lone-Hawk/Hawkgram"
Source = "https://github.com/Lone-Hawk/Hawkgram"
Tracker = "https://github.com/Lone-Hawk/Hawkgram/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "hatch>=1.7.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "twine>=4.0.2"
]

docs = [
    "sphinx",
    "sphinx-immaterial==0.12.5",
    "sphinx_copybutton",
    "sphinx-autobuild",
    "tornado>=6.3.3"
]

speedup = [
    # Forks maintained by a single third party: capped at the latest reviewed release so a new release
    # is only installed after it has been reviewed and the bound raised
    "tgcrypto-pyrofork>=1.2.6,<=1.2.8",
    "uvloop>=0.19.0"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = [
    ".github/",
    "docs/",
    "tests/",
    ".editorconfig",
    ".gitignore",
    ".pre-commit-config.yaml",
    "CODE_OF_CONDUCT.rst",
    "CONTRIBUTING.rst",
    "requirements.lock",
    "requirements-dev.lock",
]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["pyrogram"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

# Test runner used by CI (.github/workflows/python.yml) and locally with "tox"
[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py

[testenv]
deps =
    pytest>=7.4.3
    pytest-asyncio>=0.21.1
commands_pre =
    python -c "from compiler.api.compiler import start as api; from compiler.errors.compiler import start as errors; api(); errors()"
commands =
    pytest {posargs:tests}
"""
