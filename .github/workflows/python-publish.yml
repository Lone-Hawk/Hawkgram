# Builds the package and uploads it to PyPI when a version tag (v*) is pushed.
# Uses PyPI trusted publishing: no API token is stored in the repository.
#
# The build and the upload run in separate jobs, so the code and dependencies used to build the package never
# have access to the PyPI publishing credentials (id-token). Actions are pinned to commit hashes.

name: Upload Python Package

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.10'
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        hatch build
    - name: Store the package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/

  publish:

    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
    - name: Download the package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
