# Builds the package and uploads it to PyPI when a version tag (v*) is pushed.
# Uses PyPI trusted publishing: no API token is stored in the repository.
#
# The build and the upload run in separate jobs, so the code and dependencies used to build the package never
# have access to the PyPI publishing credentials (id-token). Actions are pinned to commit hashes.

name: Upload Python Package

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.10'
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        hatch build
    - name: Store the package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: dist
        path: dist/

  publish:

    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
    - name: Download the package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
